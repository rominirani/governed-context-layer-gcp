[project]
name = "governed-context-layer-gcp"
version = "1.0.0"
description = "Building a Governed Semantic, Security & Operational Context Layer on Google Cloud (Cloud SQL for PostgreSQL, Knowledge Catalog, MCP Toolbox for Databases, Model Armor, Cloud IAP & BigQuery Property Graphs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=1.6.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
